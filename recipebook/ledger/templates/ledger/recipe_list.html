{% extends 'base.html' %}

{% block title %} Recipe Book | Recipe List {% endblock %}
{% block page_heading %}<h2>Recipe List</h2>{% endblock %}

{% block content %}

    <ul>
    {% for recipe in recipes %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
        </li>
    {% endfor %}
    </ul>

    <p><a href="{% url 'ledger:recipe_form' %}"> Add Recipe </a></p>

{% endblock %}
